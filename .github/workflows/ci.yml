name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-automation:
    name: Validate automation
    uses: DevOpsDerek/workflows/.github/workflows/validate-agentic-workflows.yml@dac4b81c298cb3ea6821ea312efa5375f42d5ccb
    with:
      gh-aw-version: v0.89.21
      workflows-directory: .github/workflows

  lint:
    name: Lint (golangci-lint)
    uses: DevOpsDerek/workflows/.github/workflows/lint-go.yml@35ec3f531b5eb0f0f42f232f23e1dc5735e36c35
    with:
      go-version: "1.23.12"
      golangci-lint-version: "1.64.8"

  test:
    name: Test (go test)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22.12"
      - name: Run tests
        run: go test -v -count=1 ./... | tee test-results.out
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-test-results
          path: test-results.out
